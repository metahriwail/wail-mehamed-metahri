<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mochi the capybara" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ears -->
  <circle cx="58" cy="68" r="15" fill="#9a6f45"/>
  <circle cx="58" cy="69" r="7" fill="#e9b9a0"/>
  <circle cx="142" cy="68" r="15" fill="#9a6f45"/>
  <circle cx="142" cy="69" r="7" fill="#e9b9a0"/>

  <!-- head -->
  <ellipse cx="100" cy="108" rx="64" ry="54" fill="#b98b5e"/>

  <!-- forehead tuft -->
  <path d="M86 58 Q92 46 98 58 Q104 46 112 58" fill="none" stroke="#9a6f45" stroke-width="5" stroke-linecap="round"/>

  <!-- snout -->
  <rect x="60" y="102" width="80" height="54" rx="28" fill="#cfa77a"/>

  <!-- eyes -->
  <circle cx="72" cy="92" r="6" fill="#2d1a12"/>
  <circle cx="74" cy="90" r="2" fill="#ffffff"/>
  <circle cx="128" cy="92" r="6" fill="#2d1a12"/>
  <circle cx="130" cy="90" r="2" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="60" cy="120" rx="10" ry="6" fill="#f2a6a0" opacity="0.55"/>
  <ellipse cx="140" cy="120" rx="10" ry="6" fill="#f2a6a0" opacity="0.55"/>

  <!-- nose + mouth -->
  <ellipse cx="100" cy="114" rx="17" ry="10" fill="#5a3a2a"/>
  <ellipse cx="95" cy="111" rx="4" ry="2" fill="#8a6650" opacity="0.7"/>
  <path d="M100 124 L100 132" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M86 134 Q100 146 114 134" fill="none" stroke="#5a3a2a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
